<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carnet de bons</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="page">
    <div id="bandeaux" class="bandeaux"></div>

    <header class="hero">
      <span class="pastille">🎁 Carnet de bons</span>
      <h1 id="titre">Joyeux anniversaire !</h1>
      <p id="message" class="message"></p>
      <p class="signature">
        <span id="avatar" class="avatar" aria-hidden="true"></span>
        <span id="signature"></span>
      </p>
    </header>

    <section class="etapes" aria-label="Comment ça marche">
      <div class="etape"><span class="num" aria-hidden="true">1</span><p>Choisissez un bon dans le carnet</p></div>
      <div class="etape"><span class="num" aria-hidden="true">2</span><p>Cliquez sur «&nbsp;Utiliser ce bon&nbsp;»</p></div>
      <div class="etape"><span class="num" aria-hidden="true">3</span><p id="etape3">Je reçois votre message et je vous recontacte</p></div>
    </section>

    <main>
      <div class="resume">
        <p id="compteur" class="compteur"></p>
        <div class="jauge" aria-hidden="true"><div id="jauge" class="jauge-remplie"></div></div>
      </div>
      <div id="grille" class="grille"></div>
    </main>

    <footer class="pied">Un souci ? Appelez-moi au <strong id="telephone"></strong></footer>
  </div>

  <div id="modale" class="modale" hidden role="dialog" aria-modal="true" aria-labelledby="modale-titre">
    <div id="modale-panneau" class="modale-panneau"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script>
    // Paramètre anti-cache : GitHub Pages doit toujours servir la dernière version de config.js.
    var v = Date.now();
    document.write('<script src="config.js?v=' + v + '"><\/script>');
    document.write('<script src="app.js?v=' + v + '"><\/script>');
  </script>
</body>
</html>
